[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mayo-meme-hunter"
version = "0.1.0"
description = "Paper-only Solana meme-coin discovery and replay engine"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mayo-meme = "mayo_meme_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
