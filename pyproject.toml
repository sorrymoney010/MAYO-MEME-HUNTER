[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mayo-meme-hunter"
version = "0.2.0"
description = "Paper-only Solana meme-coin discovery and replay engine"
requires-python = ">=3.10"
dependencies = ["websockets>=12,<16"]

[project.scripts]
mayo-meme = "mayo_meme_hunter.cli:main"
mayo-night-shift = "mayo_meme_hunter.night_shift_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
